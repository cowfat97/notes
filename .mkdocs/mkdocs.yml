site_name: how 的博客
site_description: Java 后端 & 大模型开发学习笔记
site_author: cowfat97
site_dir: ../../site
site_url: https://cowfat97.github.io/notes/
docs_dir: ".."
repo_url: https://github.com/cowfat97/notes
repo_name: cowfat97/notes
edit_uri: edit/main/

plugins:
  - search

theme:
  name: material
  language: zh
  icon:
    repo: fontawesome/brands/github
    logo: material/notebook-edit-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换至暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换至亮色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.path
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

extra_css:
  - _components/book.css
  - _components/movie.css
  - _components/timeline.css
  - _components/wechat.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cowfat97
      name: GitHub
  copyright: Copyright &copy; 2025 cowfat97

markdown_extensions:
  - md_in_html
  - admonition
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path:
        - .
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - footnotes
  - toc
  - tables

nav:
  - 文章:
      - 文章/index.md
      - Java:
          - 基础: 文章/Java/Java 基础/Java 的特性.md
          - JVM: 文章/Java/JVM/JVM 内存结构.md
          - 多线程:
              - 线程创建: 文章/Java/多线程/线程创建.md
              - 线程状态: 文章/Java/多线程/线程状态.md
              - 线程池队列: 文章/Java/多线程/线程池队列.md
          - 事务:
              - 事务控制: 文章/Java/事务/事务控制.md
              - 多线程事务: 文章/Java/事务/多线程事务.md
          - 集合:
              - List: 文章/Java/集合/List.md
              - HashMap 线程安全: 文章/Java/集合/HashMap 线程安全吗？.md
          - 框架:
